- id: melcloud_home_optional_horizontal_swing
  alias: "MELCloud Home: Optional horizontal swing"
  description: >
    Optional example for MELCloud Home devices that expose named horizontal vane
    modes. Uses swing while the room error is large and centre near the target.
    Check your own entity's swing_horizontal_modes before enabling.
  mode: restart

  triggers:
    - trigger: template
      id: swing
      value_template: |
        {% set room_raw = states('sensor.living_room_temperature_average') %}
        {% set desired_raw = states('input_number.desired_temperature_living_room') %}
        {{ states('climate.living_room') in ['heat', 'cool', 'auto']
           and is_number(room_raw)
           and is_number(desired_raw)
           and ((room_raw | float) - (desired_raw | float)) | abs >= 0.7 }}
      for:
        minutes: 1

    - trigger: template
      id: centre
      value_template: |
        {% set room_raw = states('sensor.living_room_temperature_average') %}
        {% set desired_raw = states('input_number.desired_temperature_living_room') %}
        {{ states('climate.living_room') in ['heat', 'cool', 'auto']
           and is_number(room_raw)
           and is_number(desired_raw)
           and ((room_raw | float) - (desired_raw | float)) | abs <= 0.3 }}
      for:
        minutes: 1

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: swing
            - condition: template
              value_template: >
                {{ state_attr('climate.living_room', 'swing_horizontal_mode') != 'swing' }}
          sequence:
            - action: climate.set_swing_horizontal_mode
              target:
                entity_id: climate.living_room
              data:
                swing_horizontal_mode: swing

        - conditions:
            - condition: trigger
              id: centre
            - condition: template
              value_template: >
                {{ state_attr('climate.living_room', 'swing_horizontal_mode') != 'centre' }}
          sequence:
            - action: climate.set_swing_horizontal_mode
              target:
                entity_id: climate.living_room
              data:
                swing_horizontal_mode: centre
